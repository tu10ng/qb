packages:
  - 'packages/*'

# dsh 仅作为类型参考的 devDependency：QB 插件由 dsh 进程加载，
# 不需要在本仓库构建这些原生模块。
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': false
  '@google/genai': false
  # 原生模块，QB 自己要用，必须构建
  better-sqlite3: true
  koffi: false
  node-pty: false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.65'
  - '@ai-sdk/deepseek@3.0.54'
  - '@ai-sdk/gateway@4.0.94'
  - '@ai-sdk/openai-compatible@3.0.57'
  - '@ai-sdk/provider-utils@5.0.49'
  - ai@7.0.116
